name: CI

on:
  pull_request:
    # labeled/unlabeled so adding the freeze-exception label re-runs the freeze check
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Holiday change freeze
        if: github.event_name == 'pull_request'
        run: npx tsx scripts/check-freeze.ts
        env:
          FREEZE_EXCEPTION: ${{ contains(github.event.pull_request.labels.*.name, 'freeze-exception') }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Placeholder so modules that create the Neon client load; the build makes no queries
          DATABASE_URL: postgresql://ci:ci@localhost/ci
